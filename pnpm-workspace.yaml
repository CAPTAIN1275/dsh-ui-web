packages:
  - 'packages/*'
  - 'packages/skins/*'

# Peer APIs (@deepseek-ai/dsh-*, cordis, react) resolve at runtime from the
# dsh profile tree, never from this repo's own install — matching the
# turtle-ui convention used by the bundled plugins.
autoInstallPeers: false

allowBuilds:
  cpu-features: true
  esbuild: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent-default-model@0.2.0-rc.2'
  - '@deepseek-ai/dsh-agent@0.2.0-rc.2'
  - '@deepseek-ai/dsh-api-remotes@0.2.0-rc.2'
